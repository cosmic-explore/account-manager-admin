name: Backend Tests

on:
    workflow_call:
    pull_request:
    push:
        branches: [main]

jobs:
    test-backend:
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: Backend

        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.11'

            - name: Install dependencies
              run: |
                  pip install -r requirements.txt
                  pip install pytest

            - name: Run tests
              run: pytest
